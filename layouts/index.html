{{ define "main" }}
<!-- Global Landing Page / City Picker -->

<section class="min-h-screen flex flex-col items-center justify-center pt-28 pb-20 px-6 lg:px-12 bg-white relative overflow-hidden">
  <!-- Background decorations -->
  <div class="absolute top-20 right-0 w-72 h-72 bg-brand-orange/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-0 left-10 w-96 h-96 bg-brand-indigo/8 rounded-full blur-3xl pointer-events-none"></div>

  <div class="relative z-10 max-w-2xl text-center">
    <div class="mb-10 reveal">
      <span class="text-6xl mb-6 inline-block">🌻</span>
      <h1 class="font-display text-4xl md:text-5xl lg:text-6xl font-bold leading-tight mb-6">
        Welcome to <span class="gradient-text">Unskooling</span>
      </h1>
      <p class="text-lg text-deep/60 leading-relaxed font-body">
        Real-world skills, taught by mentors, right in your community hall. Select your city to discover learning circles near you.
      </p>
    </div>

    <div class="glass-card p-8 md:p-10 text-left reveal mx-auto max-w-lg">
      <h3 class="font-display text-2xl font-bold mb-6 text-center">Where do you live?</h3>
      
      <div class="flex flex-col gap-4">
        {{ range where .Site.Pages "Params.type" "city" }}
        <button onclick="selectCity('{{ .Title }}', '{{ .RelPermalink }}')" class="btn-secondary w-full justify-between text-left group">
          <span class="flex items-center gap-3">
            <span class="text-2xl group-hover:scale-110 transition-transform">📍</span>
            {{ .Title }}
          </span>
          <span class="text-brand-orange transition-transform group-hover:translate-x-1">→</span>
        </button>
        {{ end }}
      </div>
    </div>
  </div>
</section>

<script>
  function selectCity(cityName, url) {
    localStorage.setItem('userCity', cityName);
    localStorage.setItem('userCityUrl', url);
    window.location.href = url;
  }

  // Auto-redirect if they've already chosen a city
  document.addEventListener('DOMContentLoaded', () => {
    const savedUrl = localStorage.getItem('userCityUrl');
    // Only redirect if they are actually on the root page exactly, 
    // to avoid redirect loops if they visit a city page.
    if (savedUrl && window.location.pathname === '/') {
      window.location.href = savedUrl;
    }
  });
</script>

{{ end }}
