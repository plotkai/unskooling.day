{{ define "main" }}
<article class="pt-28 pb-20 px-6 lg:px-12">
  <div class="max-w-3xl mx-auto">
    <a href="/mentors/" class="text-brand-indigo text-sm font-display font-semibold hover:underline mb-6 inline-block">← Back to Mentors</a>

    <div class="flex flex-col md:flex-row gap-8 items-start mb-8">
      {{ with .Params.photo }}
      <img src="{{ . }}" alt="{{ $.Title }}" class="w-40 h-40 rounded-2xl object-cover shadow-lg">
      {{ end }}
      <div>
        <h1 class="font-display text-3xl font-bold mb-2">{{ .Title }}</h1>
        <p class="text-brand-indigo font-semibold mb-2">{{ .Params.skill }}</p>
        <div class="flex items-center gap-4 text-sm text-deep/50">
          <span>📍 {{ .Params.society }}</span>
          <span>🎓 {{ .Params.experience }}</span>
        </div>
      </div>
    </div>

    <div class="glass-card p-8 mb-8">
      <p class="text-deep/70 leading-relaxed">{{ .Params.bio }}</p>
    </div>

    <div class="text-center">
      <a href="{{ .Site.Params.mentorFormURL }}" target="_blank" class="btn-primary">
        Express Interest in {{ .Title }}'s Sessions ✨
      </a>
    </div>
  </div>
</article>
{{ end }}
